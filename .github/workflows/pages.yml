name: Yayına al (GitHub Pages)

# Depo public olduğu için Pages ücretsiz. main'e her yazışta site güncellenir.
# Telefonlardaki uygulama da kendini yeniler (sw.js).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: depo ayarlarında Pages kapalıysa açar
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Build yok; deponun kökü olduğu gibi yayınlanır
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
